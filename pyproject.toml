[project]
name = "galvo-photolysis"
version = "0.1.0"
description = "Control software for a galvo-steered UV spot-photolysis rig"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian F Smith" }]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "PySide6-Essentials>=6.8"]

[project.optional-dependencies]
demo = ["matplotlib>=3.9"]
nidaq = ["nidaqmx>=1.0"]

[project.scripts]
galvo = "galvo.gui.app:main"
galvo-demo = "galvo.demo:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-qt>=4.4", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galvo"]

[tool.uv]
# nidaqmx is only useful on Windows; keep it out of the default dev environment.
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["nidaqmx", "nidaqmx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs a real NI DAQ; skipped when none is present"]
