name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macOS = development platform, Windows = shipping platform.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --extra demo
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      # The double-click scripts for the rig PC: uv found on PATH, and uv absent
      # (forces the private install into .tools, as on a fresh shared PC).
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          call scripts\find-uv.bat
          "%UV%" --version
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          call scripts\find-uv.bat
          echo Found: %UV%
          "%UV%" --version
